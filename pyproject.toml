[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bitequiv"
version = "0.2.0"
description = "Fixed-width integer equivalence checks with independently replayed counterexamples"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "gedouluhui"}]
dependencies = ["z3-solver>=4.12,<5"]
keywords = ["bitvector", "smt", "verification", "counterexample", "integer-overflow"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
crosscheck = ["cvc5>=1.3.2,<2"]

[project.scripts]
bitequiv = "bitequiv.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
